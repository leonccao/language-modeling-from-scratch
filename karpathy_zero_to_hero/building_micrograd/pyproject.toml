[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micrograd-practice"
version = "0.1.0"
description = "A guided, implementation-free scaffold for learning micrograd."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]
demo = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
